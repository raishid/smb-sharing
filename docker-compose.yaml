services:
  smbprinter:
    build: .
    container_name: smbprinter
    restart: always
    environment:
      - NETBIOS_NAME=${NETBIOS_NAME:-printserver}
      - PRINTERS=${PRINTERS}
      - TZ=${TZ:-UTC}
    volumes:
      - ./cupsd.conf:/etc/cups/cupsd.conf:ro
      - cups_logs:/var/log/cups
      - cups_spool:/var/spool/cups
    networks:
      macvlan_lan:
        ipv4_address: ${IP_CONTAINER}
    dns:
      - ${DNS_SERVER}
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r | grep -q 'is running'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  printweb:
    build: ./web
    container_name: printweb
    restart: always
    depends_on:
      - smbprinter
    # Comparte el namespace de red de smbprinter: misma IP macvlan y mismo
    # registro DNS, sin necesidad de una segunda IP. Habla con cupsd por
    # localhost:631 y publica el panel en WEB_PORT de esa misma IP.
    network_mode: "service:smbprinter"
    environment:
      - CUPS_HOST=localhost
      - CUPS_PORT=631
      - TZ=${TZ:-UTC}
      - WEB_PORT=${WEB_PORT:-8080}
      - WEB_RETENTION_DAYS=${WEB_RETENTION_DAYS:-365}
      - DB_PATH=/data/printjobs.db
      - PAGE_LOG=/var/log/cups/page_log
    volumes:
      - cups_logs:/var/log/cups:ro
      - printweb_data:/data

networks:
  macvlan_lan:
    external: true

volumes:
  cups_logs:
  cups_spool:
  printweb_data:
